[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-fuse"
version = "0.2.0"
description = "A local circuit breaker monitor for runaway AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agent Fuse contributors" }]
keywords = [
    "ai-agents",
    "codex",
    "claude-code",
    "observability",
    "developer-tools",
    "safety",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/ryan-wolbeck/agent-fuse"
Repository = "https://github.com/ryan-wolbeck/agent-fuse"
Issues = "https://github.com/ryan-wolbeck/agent-fuse/issues"
Changelog = "https://github.com/ryan-wolbeck/agent-fuse/blob/main/CHANGELOG.md"

[project.scripts]
agent-fuse = "agent_fuse.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "build>=1.2",
    "twine>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fuse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: typer's Option()/Argument() *are* meant to be used as call defaults;
# that's the library's documented API, not the mutable-default footgun B008
# otherwise guards against.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["agent_fuse"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
